# Пример проектного openspec/config.yaml
# Источник формата: https://github.com/Fission-AI/openspec (схема spec-driven)
#
# Это ШАБЛОН для целевого проекта. Стек-специфичные правила (Java/Spring и т.п.)
# заполняются при установке из профиля stacks/<name>/openspec/config.yaml,
# либо вручную. Ядро blueprint остаётся stack-agnostic.

schema: spec-driven

context: |
  # TODO: заполнить под целевой проект.
  # Пример содержимого: тех. стек, пакетный менеджер, ограничения платформы,
  # продуктовый язык (в каком стиле писать proposal/specs).
  #
  #   Tech stack: <...>
  #   Package manager: <...>
  #
  #   Product language:
  #   - Пиши proposal и specs в терминах пользовательского поведения
  #   - Избегай отрицательных SHALL-формулировок, если тот же смысл можно
  #     выразить позитивным пользовательским исходом
  #   - Внутренние механизмы — в design.md или tasks.md, если они не часть
  #     пользовательского контракта

rules:
  specs:
    # - Правила для написания требований (напр.: требования про пути указывать
    #   поведение на всех поддерживаемых платформах).
  tasks:
    # - Правила для чек-листа задач (напр.: каждое изменение, затрагивающее X,
    #   должно включать задачу верификации Y).
  design:
    # - Правила для design.md (напр.: документировать платформенно-специфичное
    #   поведение; предпочитать явные списки вместо regex/pattern-matching).
